<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as W from './world.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const { THREE } = W;
const q = new URLSearchParams(location.search);
const scn = q.get('s') || 'base';
const Wd = +(q.get('w') || 780), Hd = +(q.get('h') || 440);
const bloom = { strength: 0.4, radius: 0.55, threshold: 0.9, exposure: 1.1, env: 1.2, envWarm: 0xb8d0ff, envRim: 0xff4fd8, envCool: 0x37b6ff };
const cv = document.getElementById('c'); cv.width = Wd; cv.height = Hd;
const S = W.stage(cv, Wd, Hd, { ...bloom, fov: +(q.get('fov') || 32) });
const { scene, cam, comp, r: renderer } = S;
const nb = W.nebulaTexture({ deep: [3, 4, 22], mid: [20, 36, 112], bright: [70, 214, 240], dust: 0.6 }, +(q.get('seed') || 8)); nb.mapping = THREE.EquirectangularReflectionMapping; scene.background = nb; scene.backgroundIntensity = 0.95;
scene.backgroundRotation = new THREE.Euler(0.2, +(q.get('rot') || 0), 0);
W.addStars(scene, 2200, 5, 1.7);
const sun = new THREE.DirectionalLight(0xdfeaff, 4.2); sun.position.set(-6, 5, 6); sun.castShadow = true;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12; sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const rim = new THREE.DirectionalLight(0xff4fd8, 4.5); rim.position.set(8, 0.4, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0x37b6ff, 1.3); fill.position.set(3, -1, 5); scene.add(fill);

const REMAP = {
  metal: { c: 0x9fb0c8, m: 0.65, r: 0.38 }, metalDark: { c: 0x4a566a, m: 0.8, r: 0.45 }, dark: { c: 0x0b1018, m: 0.5, r: 0.35, e: 0x37e6ff, ei: 0.12 },
  metalRed: { c: 0x0b4a5c, e: 0x37e6ff, ei: 0.7, m: 0.4, r: 0.3 }, skin: { c: 0x0a1c2a, e: 0x1a88b8, ei: 0.25, m: 0.9, r: 0.08 },
  crystal: { c: 0x8a2a78, e: 0xff4fd8, ei: 0.9, m: 0.2, r: 0.2 }, rock: { c: 0x565a70, m: 0.1, r: 0.95 }, rockDark: { c: 0x30344a, m: 0.1, r: 0.95 },
  rockTrack: { c: 0x60647a, m: 0.1, r: 0.95 }, _defaultMat: { c: 0x9fb0c8, m: 0.6, r: 0.4 }, bone: { c: 0xb0b8c8, m: 0.1, r: 0.8 },
};
const matCache = {};
const mat = (key, over) => { const id = key + JSON.stringify(over || {}); if (matCache[id]) return matCache[id]; const d = { ...REMAP[key], ...(over || {}) };
  const n = new THREE.MeshStandardMaterial({ color: d.c, metalness: d.m, roughness: d.r }); if (d.e !== undefined) { n.emissive = new THREE.Color(d.e); n.emissiveIntensity = d.ei; } return (matCache[id] = n); };
const loader = new GLTFLoader(), cache = {};
const put = async (name, x, y, z, ry = 0, s = 1, over = {}) => {
  if (!cache[name]) cache[name] = (await loader.loadAsync(`assets/kenney/${name}.glb`)).scene;
  const o = cache[name].clone(true);
  o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; const k = m.material.name; if (REMAP[k]) m.material = mat(k, over[k]); } });
  o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s); scene.add(o); return o; };
const tex = f => new Promise(res => new THREE.TextureLoader().load('assets/' + f, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }));
const planet = async (file, radius, pos, atmos, rings) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 64), new THREE.MeshStandardMaterial({ map: await tex(file), roughness: 0.9 })); m.position.copy(pos); m.rotation.set(0.3, 2.2, 0.15); scene.add(m);
  const a = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.05, 64, 48), new THREE.ShaderMaterial({ transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false, uniforms: { col: { value: new THREE.Color(atmos) } },
    vertexShader: 'varying vec3 n; varying vec3 v; void main(){ n = normalize(normalMatrix*normal); vec4 p = modelViewMatrix*vec4(position,1.); v = normalize(-p.xyz); gl_Position = projectionMatrix*p; }',
    fragmentShader: 'uniform vec3 col; varying vec3 n; varying vec3 v; void main(){ float i = pow(0.72 - dot(-n, v), 3.0); gl_FragColor = vec4(col, 1.) * clamp(i, 0., 1.) * 1.5; }' })); a.position.copy(pos); scene.add(a);
  if (rings) { const rg = new THREE.Mesh(new THREE.RingGeometry(radius * 1.35, radius * 2.1, 128), new THREE.MeshBasicMaterial({ color: 0xb8a888, transparent: true, opacity: 0.55, side: THREE.DoubleSide })); rg.position.copy(pos); rg.rotation.set(Math.PI / 2 - 0.35, 0.1, 0.2); scene.add(rg); }
  return m; };
const beam = (a, b, color, wd) => { const dir = b.clone().sub(a); const m = new THREE.Mesh(new THREE.CylinderGeometry(wd, wd, dir.length(), 8), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.copy(a.clone().add(b).multiplyScalar(0.5)); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()); scene.add(m); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const glow = (c, s, o, p) => scene.add(W.glowAt(c, s, o, p));
const pad = (x, z, r = 1.2) => { const m = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.04, 64), new THREE.MeshBasicMaterial({ color: 0x37e6ff, side: THREE.DoubleSide })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.02, z); scene.add(m); };
const floor = (n = 9) => { for (let i = -n; i <= n; i++) for (let j = -5; j <= 4; j++) { /* dalles de sol lunaire */ } };
const groundTiles = async (x0, x1, z0, z1) => { for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) await put('terrain', x, 0, z, 0, 1, { rock: { c: 0x3c4868, m: 0, r: 1 }, rockTrack: { c: 0x3c4868, m: 0, r: 1 }, rockDark: { c: 0x2a3350, m: 0, r: 1 }, metal: { c: 0x46547a, m: 0, r: 1 }, metalDark: { c: 0x2a3350, m: 0, r: 1 }, metalRed: { c: 0x2a3350, m: 0, r: 1, e: 0x37e6ff, ei: 0.0 } }); };

if (scn === 'base') { // base lunaire : hangars, fusée, tourelles, antennes ; planète géante à l'horizon
  await planet('2k_earth_daymap.jpg', 12, V(7, 8, -26), 0x56c6ff);
  await groundTiles(-6, 6, -3, 4);
  await put('hangar_largeA', -4.2, 0, -1.2, 0.15, 1.1); await put('hangar_roundGlass', -1.6, 0, -1.6, 0, 1); await put('hangar_largeB', 4.6, 0, -1.5, -0.2, 1.1);
  await put('rocket_baseA', 1.4, 0, -0.6, 0, 1); await put('rocket_sidesA', 1.4, 1.6, -0.6, 0, 1.8); await put('rocket_fuelA', 1.4, 2.6, -0.6, 0, 1.8); await put('rocket_topA', 1.4, 3.15, -0.6, 0, 1.8);
  await put('turret_double', -2.7, 0, 1.0, 0.3, 1.2); await put('turret_single', 3.0, 0, 1.3, -0.4, 1.2); await put('satelliteDish_large', -5.4, 0, 1.3, 0.8, 1.6); await put('machine_wireless', 5.6, 0, 1.0, 0.4, 1.5);
  await put('astronautA', -0.5, 0, 2.2, 0.35, 1.5); await put('astronautB', 0.9, 0, 2.5, -0.1, 1.3); await put('rover', -3.2, 0, 2.6, 0.9, 4.5); await put('craft_speederA', 3.4, 2.2, 0.4, 2.6, 0.9);
  pad(-0.6, 2.4, 1.6); glow(0x37e6ff, 1.3, 0.9, V(1.4, 3.3, -0.6));
  cam.position.set(0.3, 3.4, 17.5); cam.lookAt(0.3, 1.9, 0);
} else if (scn === 'station') { // station orbitale modulaire au-dessus d'une planète géante
  await planet('2k_jupiter.jpg', 15, V(-4, -13, -10), 0xffb070);
  const row = ['corridor_window', 'corridor', 'corridor_cornerRoundWindow'];
  for (let i = -3; i <= 3; i++) await put(i % 2 ? 'corridor' : 'corridor_window', i * 1.0, 0, 0, Math.PI / 2, 1);
  await put('hangar_roundGlass', 0, 0, -2.4, 0, 1.2); await put('hangar_smallA', -3.4, 0, 0.8, 1.57, 1.1); await put('structure_detailed', 3.6, 0, 0.9, 0, 1.2);
  await put('satelliteDish_large', 0.4, 1.0, 0, 0.4, 1.6); await put('machine_generatorLarge', -1.8, 0, -1.2, 0.4, 1.0); await put('pipe_ringHigh', 2.0, 0, -1.5, 0, 1.4);
  await put('craft_cargoA', -5.2, 1.5, 2.0, 1.1, 1.1); await put('craft_speederC', 5.2, 2.2, 2.6, -1.8, 1.0); await put('craft_speederB', 2.0, 3.2, -3.0, -2.6, 0.9);
  await put('astronautA', -1.2, 1.0, 1.6, 0.6, 1.1);
  glow(0x37e6ff, 1.0, 0.8, V(-5.2, 1.7, 3.4)); glow(0xff4fd8, 0.9, 0.8, V(5.0, 2.4, 3.9));
  cam.position.set(0.5, 3.0, 20); cam.lookAt(0.3, 0.8, 0);
} else if (scn === 'surface') { // exploration : surface d'astéroïde, cristaux, rover, anneaux de géante gazeuse
  await planet('2k_saturn.jpg', 9, V(-8, 9, -34), 0xf0d8a8, true);
  await groundTiles(-6, 6, -3, 4);
  for (const [x, z, a, s] of [[-3.0, -0.8, 0.3, 1.3], [2.6, -1.6, 1.1, 1.7]]) await put('rock_crystalsLargeA', x, 0, z, a, s);
  await put('rock_largeA', -5.2, 0, -1.8, 0.5, 1.6); await put('rock_largeB', 5.6, 0, -0.4, 2.0, 1.6); await put('crater', 0.2, 0.0, -1.2, 0, 2.2); await put('craterLarge', -2.0, 0, 2.2, 0, 2.2); await put('rocks_smallA', 3.8, 0, 2.0, 0.6, 1.4);
  await put('rock_crystals', -0.9, 0, 0.6, 0.8, 1.8);
  await put('rover', 1.6, 0, 1.8, -0.6, 6); await put('astronautA', -1.6, 0, 2.6, 0.9, 1.6); await put('astronautB', -0.1, 0, 2.9, 0.5, 1.4);
  await put('satelliteDish', 4.4, 0, 0.4, -0.5, 1.6);
  cam.position.set(0, 1.2, 13); cam.lookAt(0, 2.2, 0);
} else if (scn === 'battle') { // combat : escadrille contre météores et alien, au-dessus d'une planète
  await planet('2k_mars.jpg', 12, V(2, -13, -9), 0xff9a6a);
  await put('craft_speederA', -3.8, 0.9, 1.4, 0.35, 0.85); await put('craft_speederD', -2.2, 2.2, 0.2, 0.2, 0.8); await put('craft_racer', -1.9, 0.0, 2.8, 0.15, 0.8); await put('craft_miner', -4.8, 2.8, -0.8, 0.5, 0.8);
  await put('meteor_detailed', 3.2, 1.2, -1.2, 0.6, 2.2); await put('meteor', 1.2, 2.8, -2.6, 1.5, 1.6); await put('meteor_half', 4.6, 0.0, 1.8, 2.5, 1.8); await put('rock_crystals', 3.0, -0.4, 1.4, 0.4, 1.6);
  await put('alien', 2.0, 0.4, 0.3, -0.9, 2.2);
  const hit = V(2.4, 1.4, -0.4); beam(V(-2.2, 1.1, 1.4), hit, 0x6fe8ff, 0.035); beam(V(-0.6, 2.2, 0.2), hit, 0x6fe8ff, 0.03); beam(V(-0.2, 0.4, 2.6), V(2.0, 0.9, 0.4), 0x6fe8ff, 0.02);
  beam(V(2.4, 0.5, 0.3), V(-1.4, 0.5, 2.4), 0xff3a5a, 0.022); glow(0x6fe8ff, 1.8, 1, hit); glow(0xff3a5a, 1.0, 1, V(2.4, 0.5, 0.3)); glow(0x6fe8ff, 0.8, 1, V(-2.2, 1.1, 1.4));
  cam.position.set(0, 2.0, 12.5); cam.lookAt(0, 1.0, 0);
} else if (scn === 'hub') { // écran portrait : hub de la base (fond du menu)
  await planet('2k_earth_daymap.jpg', 9, V(3, 5, -22), 0x56c6ff);
  await groundTiles(-4, 4, -2, 3);
  await put('hangar_roundGlass', -2.2, 0, -0.2, 0.2, 1.2); await put('hangar_largeA', 2.0, 0, 0.1, -0.3, 1.2);
  await put('rocket_baseA', 0.1, 0, -1.6, 0, 1); await put('rocket_sidesA', 0.1, 1.6, -1.6, 0, 1.8); await put('rocket_fuelA', 0.1, 2.6, -1.6, 0, 1.8); await put('rocket_topA', 0.1, 3.15, -1.6, 0, 1.8);
  await put('turret_double', -1.0, 0, 1.4, 0.2, 1.2); await put('astronautA', 0.6, 0, 2.0, 0.3, 1.0); await put('astronautB', 1.5, 0, 2.2, -0.2, 0.9); await put('rover', -2.6, 0, 2.0, 0.8, 3.8);
  pad(0.8, 2.0, 1.4);
  cam.position.set(0, 3.0, 10.5); cam.lookAt(0, 2.0, 0);
}
cam.updateProjectionMatrix(); comp.render(); setInterval(() => comp.render(), 500); document.title = 'ready';
</script></body></html>
