name: Valider le projet Godot
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importer le projet
        run: godot --headless --path . --import
      - name: Lancer 2 secondes (détecte les erreurs de script)
        run: godot --headless --path . --quit-after 120
