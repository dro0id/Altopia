name: Unity (prototype Route)

on:
  push:
    paths: ['unity/**', 'tools/unity_check.sh', 'tools/blender/**', '.github/workflows/unity.yml']
  workflow_dispatch:

jobs:
  compile:
    name: Compilation des scripts (sans licence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/unity_check.sh

  unity:
    name: Tests et builds Unity (licence requise)
    runs-on: ubuntu-latest
    needs: compile
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        target: [Android, WebGL]
    steps:
      - name: Licence Unity absente
        if: env.UNITY_LICENSE == ''
        run: echo "Secrets UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD non définis : tests et builds Unity ignorés (voir unity/AltopiaRoute/README.md)."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: unity/AltopiaRoute/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('unity/AltopiaRoute/Packages/manifest.json') }}
      - name: Tests (EditMode + PlayMode)
        if: env.UNITY_LICENSE != '' && matrix.target == 'WebGL'
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: unity/AltopiaRoute
          unityVersion: 2022.3.20f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.target }}
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity/AltopiaRoute
          unityVersion: 2022.3.20f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: BuildRoute.${{ matrix.target }}
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: AltopiaRoute-${{ matrix.target }}
          path: build/${{ matrix.target }}
