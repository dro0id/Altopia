name: Tests et APK Android

# Économie de minutes GitHub Actions : pas de second lancement pour la demande de fusion (le push suffit),
# et le test sur émulateur (long) ne tourne qu'à la demande : onglet Actions > « Run workflow ».
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier l'APK dans une Release

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importer le projet
        run: godot --headless --path . --import
      - name: Tests unitaires
        run: godot --headless --path . -s tests/run_tests.gd

  apk:
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Installer les modèles d'export
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Installer le SDK Android 34 (cible par défaut de Godot 4.3)
        run: |
          SDKM=/usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --sdk_root=/usr/lib/android-sdk --licenses > /dev/null || true
          $SDKM --sdk_root=/usr/lib/android-sdk "platforms;android-34" "build-tools;34.0.0"
          ls /usr/lib/android-sdk/platforms /usr/lib/android-sdk/build-tools
      - name: Configurer Android (SDK + clé de debug)
        run: |
          mkdir -p ~/.config/godot
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac)")")")}"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JDK}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/tools/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
      - name: Numéro de version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
      - name: Diagnostic Android
        run: |
          echo "SDK=$ANDROID_HOME / $ANDROID_SDK_ROOT  JAVA_HOME=$JAVA_HOME"
          cat ~/.config/godot/editor_settings-4.3.tres
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head -30
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" || true
          ls -la tools/debug.keystore
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/33.0.2" || true
          ls /usr/lib/android-sdk/platform-tools | head -5 || true
      - name: Exporter l'APK
        run: |
          godot --headless --path . --import
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/altopia.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: altopia-apk
          path: build/altopia.apk
      # APK de test pour émulateur x86_64 : même jeu, plus le parcours automatique (fonction « autotest », scripts/autotest.gd)
      - name: Exporter l'APK de test (émulateur x86_64)
        run: |
          sed -i 's/^architectures\/arm64-v8a=.*/architectures\/arm64-v8a=false/; s/^architectures\/x86_64=.*/architectures\/x86_64=true/; s/^custom_features=.*/custom_features="autotest"/; s#^export_path=.*#export_path="build/altopia-test.apk"#' export_presets.cfg
          godot --headless --path . --export-debug "Android" build/altopia-test.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: altopia-test-apk
          path: build/altopia-test.apk

  # Test réel : l'APK tourne dans un émulateur Android 14 (écran 1080x2400 comme le Xiaomi 11T) et déroule le parcours en jeu.
  emulator:
    needs: apk
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: altopia-test-apk
          path: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Parcours en jeu sur émulateur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_test.sh apk/altopia-test.apk emulator_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: emulator_out

  # Lien de téléchargement direct (utilisable depuis le téléphone, sans compte GitHub
  # pour un dépôt public). Mis à jour à chaque push sur main ou sur une branche ccr-*.
  release:
    needs: apk
    if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'ccr-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: altopia-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Altopia — dernière version de test
          body: "APK de debug généré automatiquement (commit ${{ github.sha }})."
          prerelease: true
          files: altopia.apk
